[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-mcp"
version = "0.1.0"
description = "Read-only crypto market analysis MCP server"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1,<2",
  "ccxt",
  "httpx",
  "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]
