[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-mcp"
version = "0.6.0"
description = "Multi-agent analysis with paper exchange and offline backtesting (live disabled)"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1,<2",
  "ccxt",
  "httpx",
  "python-dotenv",
  "pydantic>=2",
  "pydantic-settings>=2",
  "pyyaml",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
trader = "crypto_trading_mcp.cli.trader:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
