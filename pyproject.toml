[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-mcp"
version = "0.8.0"
description = "Multi-agent paper trading with dashboard and self-learning (live disabled)"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1,<2",
  "ccxt",
  "httpx",
  "python-dotenv",
  "pydantic>=2",
  "pydantic-settings>=2",
  "pyyaml",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]
ml = [
  "scikit-learn>=1.4",
  "xgboost>=2.0; platform_machine != 'armv7l'",
]

[project.scripts]
trader = "crypto_trading_mcp.cli.trader:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
