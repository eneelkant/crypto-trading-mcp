sandbox:
  selected_venue: delta_india
  environment: TESTNET
  stage: STAGE_2_CLOUD_PAPER

  delta_india:
    # Isolated Delta India / Delta testnet hosts only. Production host is rejected in Stage 2.
    allowed_base_urls:
      - https://cdn-ind.testnet.deltaex.org
      - https://testnet-api.delta.exchange
      - https://testnet-api.india.delta.exchange
    rejected_base_urls:
      - https://api.india.delta.exchange
      - https://api.delta.exchange
    default_base_url: https://cdn-ind.testnet.deltaex.org
    websocket_url: wss://cdn-ind.testnet.deltaex.org/ws
    auth: HMAC-SHA256
    permissions_allowed:
      - READ_ONLY
      - TRADING
    permissions_forbidden:
      - WITHDRAWAL
    env_keys:
      - DELTA_API_KEY
      - DELTA_API_SECRET
      - DELTA_API_BASE_URL
    supported_operations:
      - authenticate
      - health_check
      - get_account
      - get_balances
      - get_positions
      - get_open_orders
      - get_order_status
      - submit_order
      - cancel_order
      - cancel_all_orders
      - market_data_rest
    websocket: optional
    notes: >
      Real Delta testnet credentials are never committed. CI uses transport mocks /
      LocalSandboxHarness. Production base URLs are rejected while STAGE_2_CLOUD_PAPER.

  coinbase:
    # Not selected for Stage 2; kept for comparison only.
    selected: false
    reason: HMAC/JWT surface less complete than Delta for authenticated order lifecycle in-repo
