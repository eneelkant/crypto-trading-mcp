trading_mode: paper
live_trading_enabled: false

market_data:
  default_exchange_id: kraken
  # Public read-only exchanges only. Never construct authenticated clients from tool args.
  allowed_exchanges:
    - kraken
    - coinbase
    - binance
    - bitstamp
    - gemini
  default_timeframe: 1h
  ohlcv_limit: 120
  max_age_seconds: 120
  multi_timeframes:
    - 5m
    - 15m
    - 240m

analysis:
  minimum_confidence_for_direction: 0.55

strategy:
  default_id: multi_model_po3_vwap
  default_version: "1.0.0"

# Global risk limits live in config/risk.yaml and always win when stricter.
